[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uncomfy"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "taskiq",
    "sqlalchemy[asyncio]",
    "aiosqlite",
    "alembic",
    "pydantic-settings",
    "httpx",
    "python-multipart",
]

[project.optional-dependencies]
redis = ["taskiq-redis"]
dev   = ["pytest", "pytest-asyncio", "pytest-mock"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths   = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["uncomfy"]
