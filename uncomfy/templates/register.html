{% extends "base.html" %}
{% block title %}Регистрация — uncomfy{% endblock %}
{% block content %}
<div style="max-width:360px;margin:60px auto">
  <div class="card">
    <h2 style="font-size:18px;margin-bottom:20px">Создать аккаунт</h2>

    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <form method="post" action="/register">
      <div class="form-group">
        <label>Логин</label>
        <input type="text" name="username" minlength="3" autocomplete="username" autofocus required>
      </div>
      <div class="form-group">
        <label>Пароль</label>
        <input type="password" name="password" minlength="6" autocomplete="new-password" required>
      </div>
      <button class="btn btn-primary" style="width:100%">Зарегистрироваться</button>
    </form>

    <p style="margin-top:16px;text-align:center;color:var(--muted);font-size:13px">
      Уже есть аккаунт? <a href="/login">Войти</a>
    </p>
  </div>
</div>
{% endblock %}
