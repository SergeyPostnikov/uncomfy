{% extends "base.html" %}
{% block title %}Вход — uncomfy{% endblock %}
{% block content %}
<div style="max-width:360px;margin:60px auto">
  <div class="card">
    <h2 style="font-size:18px;margin-bottom:20px">Войти</h2>

    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <form method="post" action="/login">
      <div class="form-group">
        <label>Логин</label>
        <input type="text" name="username" autocomplete="username" autofocus required>
      </div>
      <div class="form-group">
        <label>Пароль</label>
        <input type="password" name="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn-primary" style="width:100%">Войти</button>
    </form>

    <p style="margin-top:16px;text-align:center;color:var(--muted);font-size:13px">
      Нет аккаунта? <a href="/register">Зарегистрироваться</a>
    </p>
  </div>
</div>
{% endblock %}
